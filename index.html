<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro - Timer</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span>✔</span> PomodoIT
            </a>
            
            <div class="nav-btns">
                <button class="nav-btn settings-btn">Settings</button>
            </div>
        </nav>
    </header>
    <main>
        <section class="timer">
            <div class="btns">
                <div class="pomodoro-timer">
                    <button class="pomodoro-btn">Pomodoro</button>
                </div>
                <div class="short-break">
                    <button class="short-btn">Short Break</button>
                </div>
                <div class="long-break">
                    <button class="long-btn">Long Break</button>
                </div>
            </div>
            <div class="time">
                <h1 id="timer">25:00</h1>
                <button class="start-btn">Start</button>
            </div>
        </section>

        <section class="tasks">
            <p class="task-text">Time to focus!</p>
            
            <div class="tasks-menu">
                <p>Tasks</p>
            </div>

            <div class="tasks-list"></div>

            <div class="add-task-form hidden">
                <input type="text" id="task-input" placeholder="What are you working on?" autocomplete="off">
                <div class="form-btns">
                    <button type="button" class="cancel-btn">Cancel</button>
                    <button type="button" class="save-btn">Save</button>
                </div>
            </div>

            <button class="add-task-btn">
                <span>+</span> Add Task
            </button>
        </section>
    </main>
    <footer>
        <a href="https://github.com/Varonii">Github</a>
    </footer>

<div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2>Settings</h2>
            <button class="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body">
            <div class="setting-group">
                <label>Time (minutes)</label>
                <div class="inputs-row">
                    <div>
                        <label>Pomodoro</label>
                        <input type="number" id="pomodoro-time" min="1" max="90">
                    </div>
                    <div>
                        <label>Short Break</label>
                        <input type="number" id="short-time" min="1" max="30">
                    </div>
                    <div>
                        <label>Long Break</label>
                        <input type="number" id="long-time" min="1" max="45">
                    </div>
                </div>
            </div>
            <div class="setting-group">
                <label for="sound-select">Alarm Sound</label>
                <select id="sound-select">
                    <option value="piano">Piano</option>
                    <option value="bell">Bell</option>
                    <option value="digital">Digital</option>
                    <option value="fastBell">Fast Bell</option>
                    <option value="soft">Soft</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="save-settings-btn">Save</button>
        </div>
    </div>
</div>
</body>
</html>
